name: Windows installer

# Tags like v0.16.14-win.1 build the unsigned NSIS installer and portable ZIP
# and attach them to the GitHub Release.

on:
  push:
    tags: ['v*-win*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:win
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

      - name: Build installer and ZIP
        run: npm run make:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem -File -Include *.exe,*.zip -Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_ } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: |
            app/dist/*.exe
            app/dist/*.zip
            app/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md <<'EOF'
          Unsigned Windows build of the Ulanzi Deck Open fork, produced from source by GitHub Actions.

          * `Ulanzi-Deck-Open-Setup-*.exe` — installer (Start menu shortcut, uninstaller).
          * `Ulanzi-Deck-Open-*-win-x64.zip` — portable: unzip and run `Ulanzi Deck Open.exe`.

          The build is **not code-signed**, so Windows SmartScreen warns on first run:
          choose **More info → Run anyway**. Quit Ulanzi Studio before starting the app.
          See docs/WINDOWS.md.
          EOF
          FILES=(app/dist/*.exe app/dist/*.zip app/dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Ulanzi Deck Open for Windows $TAG" --notes-file release-notes.md
          fi
