name: CI (Windows fork)

# The fork's work happens on the `windows` branch. Run the suite on Windows and
# on Linux, so the macOS/POSIX paths stay green next to the Windows ones.

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies (skip Electron download)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:win
      - name: Unit tests (Linux)
        if: runner.os != 'Windows'
        run: npm test
